<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARASHOV AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Fon animatsiya */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: #000;
    overflow: hidden;
  }
  .bg::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation: bgMove1 12s ease-in-out infinite;
  }
  .bg::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
    bottom: -80px; right: -80px;
    animation: bgMove2 15s ease-in-out infinite;
  }
  @keyframes bgMove1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(80px,60px)} }
  @keyframes bgMove2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,-80px)} }

  /* Suzuvchi tugmalar */
  .float-btn {
    position: fixed;
    z-index: 100;
    border: none; cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    backdrop-filter: blur(12px);
  }
  .float-btn:hover { transform: scale(1.08) translateY(-2px); }
  .float-btn:active { transform: scale(0.95); }

  .fb1 {
    top: 28px; left: 28px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 10px 18px; border-radius: 30px;
    animation: floatY1 4s ease-in-out infinite;
  }
  .fb2 {
    top: 28px; right: 28px;
    background: #fff;
    color: #000;
    padding: 10px 18px; border-radius: 30px;
    box-shadow: 0 4px 24px rgba(255,255,255,0.2);
    animation: floatY2 5s ease-in-out infinite;
  }
  .fb3 {
    bottom: 28px; left: 28px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 10px 18px; border-radius: 30px;
    animation: floatY3 6s ease-in-out infinite;
  }
  .fb4 {
    bottom: 28px; right: 28px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    padding: 10px 18px; border-radius: 30px;
    animation: floatY1 7s ease-in-out infinite reverse;
  }

  @keyframes floatY1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes floatY2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  @keyframes floatY3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* Asosiy app */
  .app {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    width: 100%; max-width: 560px;
    height: 92vh; max-height: 780px;
    background: #0a0a0a;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.05),
      0 40px 120px rgba(0,0,0,0.8),
      0 0 80px rgba(255,255,255,0.03);
    margin: 0 16px;
  }

  /* Header */
  .header {
    padding: 20px 24px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.02);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  .logo {
    width: 46px; height: 46px; border-radius: 14px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #000;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
  }
  .header-info { flex: 1; }
  .header-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
  .header-sub { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 5px 10px; border-radius: 20px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,0.4)} 50%{opacity:0.7;box-shadow:0 0 0 4px rgba(74,222,128,0)} }

  /* Messages */
  .msgs {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .msgs::-webkit-scrollbar { width: 3px; }
  .msgs::-webkit-scrollbar-track { background: transparent; }
  .msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .msg { display: flex; gap: 12px; animation: msgIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes msgIn { from{opacity:0;transform:translateY(12px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px; border-radius: 12px;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700;
  }
  .avatar.ai {
    background: #fff; color: #000;
    box-shadow: 0 0 16px rgba(255,255,255,0.1);
  }
  .avatar.user {
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .msg-wrap { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user .msg-wrap { align-items: flex-end; }

  .bubble {
    padding: 12px 16px;
    font-size: 14px; line-height: 1.7;
    word-break: break-word;
  }
  .bubble.ai {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.9);
    border-radius: 4px 16px 16px 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .bubble.user {
    background: #fff;
    color: #000;
    border-radius: 16px 4px 16px 16px;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(255,255,255,0.1);
  }
  .time { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 5px; padding: 0 4px; }

  /* Typing */
  .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    animation: bounce 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-7px);opacity:1} }

  /* Welcome */
  .welcome { text-align: center; padding: 32px 10px; }
  .w-icon {
    width: 64px; height: 64px; border-radius: 20px;
    background: #fff; color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 16px;
    box-shadow: 0 0 40px rgba(255,255,255,0.12);
  }
  .welcome h3 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.3px; }
  .welcome p { font-size: 13px; color: rgba(255,255,255,0.35); line-height: 1.7; }

  .sugs { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .sug {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.55);
    font-size: 13px; padding: 10px 14px;
    border-radius: 12px; cursor: pointer; text-align: left;
    transition: all 0.2s; font-family: 'Inter', sans-serif;
    font-weight: 400;
  }
  .sug:hover {
    border-color: rgba(255,255,255,0.25);
    color: #fff;
    background: rgba(255,255,255,0.07);
    transform: translateX(4px);
  }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0; padding: 0 4px;
  }
  .divider span { font-size: 11px; color: rgba(255,255,255,0.15); white-space: nowrap; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.07);
  }

  /* Input */
  .bottom {
    padding: 16px 20px;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex; flex-direction: column; gap: 12px;
    flex-shrink: 0;
  }

  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .wrap {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    display: flex; align-items: center; padding: 0 16px;
    transition: border-color 0.2s, background 0.2s;
  }
  .wrap:focus-within {
    border-color: rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.07);
  }
  textarea {
    width: 100%; border: none; background: transparent;
    color: #fff; font-size: 14px; font-family: 'Inter', sans-serif;
    resize: none; padding: 13px 0; max-height: 100px;
    outline: none; line-height: 1.5; font-weight: 400;
  }
  textarea::placeholder { color: rgba(255,255,255,0.2); }

  .actions { display: flex; gap: 8px; }

  .btn {
    height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 13px;
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    flex-shrink: 0;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.95) translateY(0); }

  .btn-send {
    width: 44px;
    background: #fff; color: #000;
    box-shadow: 0 4px 20px rgba(255,255,255,0.15);
    font-size: 18px;
  }
  .btn-send:hover { box-shadow: 0 8px 30px rgba(255,255,255,0.25); }
  .btn-send:disabled { opacity: 0.2; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-clear {
    width: 44px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.35);
    font-size: 16px;
  }
  .btn-clear:hover {
    background: rgba(255,60,60,0.1);
    border-color: rgba(255,60,60,0.2);
    color: #ff6b6b;
    box-shadow: none;
    transform: translateY(-2px);
  }

  /* Quick chips */
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    font-size: 12px; padding: 6px 12px; border-radius: 20px;
    cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .chip:hover {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.07);
    transform: translateY(-1px);
  }

  /* Scroll to bottom */
  .scroll-btn {
    position: absolute; bottom: 90px; right: 24px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 16px;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .scroll-btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
  .scroll-btn.show { display: flex; }
</style>
</head>
<body>

<div class="bg"></div>

<!-- Suzuvchi tugmalar -->
<button class="float-btn fb1" onclick="useSug('Salom! Kim bo\'lding sen?')">👋 Salom</button>
<button class="float-btn fb2" onclick="useSug('Menga qisqa motivatsion gap ayt')">✦ Motivatsiya</button>
<button class="float-btn fb3" onclick="useSug('Kod yozishda yordam ber')">{'</>'}  Kod</button>
<button class="float-btn fb4" onclick="useSug('Bugun nima o\'rgansam bo\'ladi?')">◈ O'rganish</button>

<div class="app">
  <div class="header">
    <div class="logo">YA</div>
    <div class="header-info">
      <div class="header-title">YARASHOV AI</div>
      <div class="header-sub">Groq · Llama 3.3 70B Versatile</div>
    </div>
    <div class="header-right">
      <div class="status"><div class="dot"></div>Online</div>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="welcome" id="welcome">
      <div class="w-icon">🤖</div>
      <h3>Assalomu alaykum!</h3>
      <p>Men YARASHOV AI — Groq texnologiyasi bilan<br>qurollangan aqlli yordamchingizman.</p>
      <div class="sugs">
        <button class="sug" onclick="useSug(this.textContent)">🧠 Sun'iy intellekt nima va u qanday ishlaydi?</button>
        <button class="sug" onclick="useSug(this.textContent)">💻 Python da kalkulyator dasturi yoz</button>
        <button class="sug" onclick="useSug(this.textContent)">🌍 O'zbekiston haqida 5 ta qiziqarli fakt ayt</button>
        <button class="sug" onclick="useSug(this.textContent)">✍️ Menga kuchli motivatsion so'z ayt</button>
      </div>
    </div>
  </div>

  <button class="scroll-btn" id="scrollBtn" onclick="scrollDown()">↓</button>

  <div class="bottom">
    <div class="chips">
      <button class="chip" onclick="useSug('Tushuntir')">💡 Tushuntir</button>
      <button class="chip" onclick="useSug('Kod yoz')">{'</>'} Kod</button>
      <button class="chip" onclick="useSug('Tarjima qil')">🌐 Tarjima</button>
      <button class="chip" onclick="useSug('Qisqartir')">✂️ Qisqartir</button>
      <button class="chip" onclick="useSug('Davom et')">→ Davom</button>
    </div>
    <div class="input-row">
      <div class="wrap">
        <textarea id="inp" rows="1" placeholder="Xabar yozing..." onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      </div>
      <button class="btn btn-clear" onclick="clearChat()" title="Tozalash">🗑</button>
      <button class="btn btn-send" id="sendBtn" onclick="send()" title="Yuborish">➤</button>
    </div>
  </div>
</div>

<script>
let history = [];
let busy = false;
const msgsEl = document.getElementById('msgs');
const inpEl = document.getElementById('inp');
const sendBtn = document.getElementById('sendBtn');
const scrollBtn = document.getElementById('scrollBtn');

// Scroll indicator
msgsEl.addEventListener('scroll', () => {
  const fromBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight;
  scrollBtn.classList.toggle('show', fromBottom > 100);
});

function scrollDown() { msgsEl.scrollTo({top: msgsEl.scrollHeight, behavior:'smooth'}); }

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function now() {
  return new Date().toLocaleTimeString('uz-UZ', {hour:'2-digit', minute:'2-digit'});
}
function rmWelcome() { const w=document.getElementById('welcome'); if(w) w.remove(); }

function addMsg(role, text) {
  rmWelcome();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `
    <div class="avatar ${role}">${role==='ai'?'YA':'SIZ'}</div>
    <div class="msg-wrap">
      <div class="bubble ${role}">${esc(text)}</div>
      <div class="time">${now()}</div>
    </div>`;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function esc(t) {
  return t
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:5px;font-size:12px">$1</code>')
    .replace(/\n/g,'<br>');
}

function showTyping() {
  rmWelcome();
  const d = document.createElement('div');
  d.className='msg ai'; d.id='typ';
  d.innerHTML=`<div class="avatar ai">YA</div><div class="msg-wrap"><div class="bubble ai"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { const t=document.getElementById('typ'); if(t) t.remove(); }

function useSug(t) {
  inpEl.value = t.trim();
  resize(inpEl);
  inpEl.focus();
  send();
}

async function send() {
  const text = inpEl.value.trim();
  if (!text || busy) return;
  inpEl.value=''; inpEl.style.height='auto';
  busy=true; sendBtn.disabled=true;

  history.push({ role:'user', content:text });
  addMsg('user', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'Javob olishda xatolik.';
    history.push({ role:'assistant', content:reply });
    hideTyping();
    addMsg('ai', reply);
  } catch(e) {
    hideTyping();
    addMsg('ai', '⚠️ Xatolik: ' + e.message);
  } finally {
    busy=false; sendBtn.disabled=false; inpEl.focus();
  }
}

function clearChat() {
  history=[];
  msgsEl.innerHTML=`<div class="welcome" id="welcome">
    <div class="w-icon">🤖</div>
    <h3>Assalomu alaykum!</h3>
    <p>Men YARASHOV AI — Groq texnologiyasi bilan<br>qurollangan aqlli yordamchingizman.</p>
    <div class="sugs">
      <button class="sug" onclick="useSug(this.textContent)">🧠 Sun'iy intellekt nima va u qanday ishlaydi?</button>
      <button class="sug" onclick="useSug(this.textContent)">💻 Python da kalkulyator dasturi yoz</button>
      <button class="sug" onclick="useSug(this.textContent)">🌍 O'zbekiston haqida 5 ta qiziqarli fakt ayt</button>
      <button class="sug" onclick="useSug(this.textContent)">✍️ Menga kuchli motivatsion so'z ayt</button>
    </div>
  </div>`;
}

inpEl.focus();
</script>
</body>
</html>
